<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rectangle (maskable safe area compliant) -->
  <rect width="512" height="512" rx="96" fill="url(#bg)" />
  <rect width="496" height="496" x="8" y="8" rx="88" fill="none" stroke="#1E293B" stroke-width="4" />

  <!-- Radar / Circular rings indicating civic watch -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6 6" opacity="0.6" />
  <circle cx="256" cy="256" r="110" fill="none" stroke="#334155" stroke-width="2" opacity="0.4" />

  <!-- Seismic / Pulse wave -->
  <path d="M 120 280 L 190 280 L 215 220 L 245 330 L 275 240 L 295 290 L 320 280 L 392 280" 
        fill="none" stroke="url(#wave)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" filter="url(#glow)" />

  <!-- Central Civic Shield & Power Lightning Bolt -->
  <path d="M 270 130 L 195 250 L 250 250 L 230 370 L 325 235 L 265 235 Z" 
        fill="url(#bolt)" filter="url(#glow)" />

  <!-- Brand text badge -->
  <rect x="156" y="400" width="200" height="34" rx="17" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
  <text x="256" y="422" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="16" font-weight="700" fill="#F8FAFC" letter-spacing="3" text-anchor="middle">WATCH CEBU</text>
</svg>
